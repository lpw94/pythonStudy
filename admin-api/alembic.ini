# Alembic config: versioned database migrations
#
# NOTE: keep this file ASCII-only. Alembic reads it with the *locale*
# encoding (configparser.read(..., encoding="locale")), which is GBK on
# Chinese Windows -- a UTF-8 Chinese comment here raises UnicodeDecodeError.
#
# Glossary (mapping to the Node ecosystem):
#   migration  = one schema change script (like a knex/prisma migration)
#   revision   = version id, monotonically increasing
#   upgrade    = apply changes forward
#   downgrade  = roll changes back
#
# Common commands (run from the admin-api/ directory):
#   alembic upgrade head                              # apply to latest
#   alembic downgrade -1                              # roll back one revision
#   alembic revision --autogenerate -m "description"  # diff models -> new revision
#   alembic current                                   # current DB revision
#   alembic history                                   # revision history

[alembic]
# where the migration scripts live
script_location = migrations
# filename template: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s
# max length of the slug part
truncate_slug_length = 40

# The DB URL is resolved in migrations/env.py from admin_api.config
# (i.e. .env -> settings.database_url). This fallback is only used
# if DATABASE_URL is not set at all.
sqlalchemy.url =


# ============================================================
# logging
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
