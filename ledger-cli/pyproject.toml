[project]
name = "ledger-cli"
version = "0.1.0"
description = "个人记账 CLI — 阶段1 Python 学习项目（对照 JS 学语法）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",   # CLI 框架，装饰器即路由，对标 commander.js / yargs
    "rich>=13",      # 终端美化输出，Typer 已依赖它，这里显式声明
]

# 安装后可直接在终端敲 `ledger` 命令（对标 npm bin）
[project.scripts]
ledger = "ledger.main:cli"

# 开发依赖单独分组，生产安装不会带进来
[dependency-groups]
dev = [
    "ruff>=0.8",   # lint + format 一体，对标 ESLint + Prettier
    "pytest>=8.3", # 测试框架，fixture 机制对标 Jest
]

# 告诉构建工具：包在 src/ledger 下
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

# ---- Ruff 配置（lint 规则）----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E=pycodestyle 错误 F=pyflakes 错误 I=import 排序 UP=现代化语法 B=bug 倾向
select = ["E", "F", "I", "UP", "B"]
# B008: Typer 用 typer.Option(...) 作默认值属正常写法，官方建议忽略
# UP042: 保留 (str, Enum) 写法以保证教学清晰度与 3.11 一致性
ignore = ["B008", "UP042"]

# ---- pytest 配置 ----
[tool.pytest.ini_options]
testpaths = ["tests"]
